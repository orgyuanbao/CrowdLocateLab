name: Offline software and mathematical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check local numeric prerequisites
        run: python doctor.py --json
      - name: Test isolated fixtures without models or research datasets
        run: python -m unittest discover -s tests -v
      - name: Test unchanged Creative-Intelligence controller without models
        # Only command-construction fixtures need an existing executable; no model is run.
        run: python -B -c "import os, sys, unittest; os.environ['CODEX_EXECUTABLE'] = sys.executable; suite = unittest.defaultTestLoader.discover('integrations/creative_intelligence/vendor/tests'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(not result.wasSuccessful())"
      - name: Test Creative-Intelligence integration without models
        run: python -B -m unittest discover -s integrations/creative_intelligence/tests -v
      - name: Reproduce Creative-Intelligence study without models
        run: python -B studies/creative_intelligence/mirror_ambiguity/reproduce_checks.py
      - name: Verify preserved first-study evidence without model calls
        run: python audit.py --run runs/live_reference --require-frozen
      - name: Verify preserved revision evidence without model calls
        run: python audit.py --run runs/revision_reference --require-frozen
      - name: Recompute saved statistics without fitting or new data
        run: python verification/check_revision_results.py
      - name: Build audited evidence archives from both preserved studies
        run: |
          python research_archive.py --run runs/live_reference --output archives/ci_live
          python research_archive.py --run runs/revision_reference --output archives/ci_revision
