name: Offline software and mathematical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check local numeric prerequisites
        run: python doctor.py --json
      - name: Test isolated fixtures without models or research datasets
        run: python -m unittest discover -s tests -v
