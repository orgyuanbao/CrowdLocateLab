name: Offline software and mathematical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check local numeric prerequisites
        run: python doctor.py --json
      - name: Test isolated fixtures without models or research datasets
        run: python -m unittest discover -s tests -v
      - name: Verify preserved first-study evidence without model calls
        run: python audit.py --run runs/live_reference --require-frozen
      - name: Verify preserved revision evidence without model calls
        run: python audit.py --run runs/revision_reference --require-frozen
      - name: Recompute saved statistics without fitting or new data
        run: python verification/check_revision_results.py
      - name: Build audited evidence archives from both preserved studies
        run: |
          python research_archive.py --run runs/live_reference --output archives/ci_live
          python research_archive.py --run runs/revision_reference --output archives/ci_revision
